name: Update casks

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: .github/scripts/use-checkout-as-tap.sh

      - name: Update outdated casks
        id: bump
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          updated="$(.github/scripts/bump-outdated-casks.sh)"
          echo "casks=$(xargs <<<"$updated")" >> "$GITHUB_OUTPUT"

      - name: Check style
        if: steps.bump.outputs.casks != ''
        run: brew style davidswords/tap

      - name: Test updated casks
        if: steps.bump.outputs.casks != ''
        env:
          CASKS: ${{ steps.bump.outputs.casks }}
        run: |
          for cask in $CASKS; do
            .github/scripts/test-cask.sh "$cask"
          done

      - name: Commit and push to main
        if: steps.bump.outputs.casks != ''
        env:
          CASKS: ${{ steps.bump.outputs.casks }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "Update casks: $CASKS"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
