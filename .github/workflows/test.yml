name: Test casks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: .github/scripts/use-checkout-as-tap.sh

      - name: Check style
        run: brew style davidswords/tap

      - name: Test each cask
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          casks=(Casks/*.rb)
          if [ "${#casks[@]}" -eq 0 ]; then
            echo "::error::No casks found in Casks/"
            exit 1
          fi
          for file in "${casks[@]}"; do
            .github/scripts/test-cask.sh "$(basename "$file" .rb)"
          done
